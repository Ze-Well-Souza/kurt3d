name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Uma execução por branch: um push novo cancela a anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Checagem de tipos
        run: bunx tsc --noEmit

      - name: Testes
        run: bun test

  # Separado do job acima para que a dívida de formatação herdada não
  # bloqueie tipos e testes. Vira `continue-on-error: false` ao fim da Fase 4.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint
